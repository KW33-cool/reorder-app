<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nachbestell‑App</title>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.10/html5-qrcode.min.js"></script>

<style>
body{font-family:system-ui;margin:20px}
</style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "YOUR_KEY",
  authDomain: "YOUR_DOMAIN",
  projectId: "YOUR_PROJECT"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// FIX: Link korrekt übergeben
async function saveProduct(){
  const n = document.getElementById("name").value;
  const l = document.getElementById("link").value;
  await addDoc(collection(db,"products"), {name:n, link:l});
  alert("Gespeichert");
}

// BARCODE
function showBarcode(code){
  document.getElementById("barcodeBox").innerHTML = '<svg id="barcode"></svg>';
  JsBarcode("#barcode", code, {format:"CODE128", height:60});
}

// DRUCK MIT PREIS
function printLabel(){
  const price = prompt("Preis eingeben:", "0,00 €");
  if(!price) return;

  const svg = document.getElementById("barcodeBox").innerHTML;

  const w = window.open("");
  w.document.write(`
    <div style="width:4cm;height:2cm;text-align:center;">
      ${svg}
      <div>${price}</div>
    </div>
  `);
  w.print();
}
</script>
</head>

<body>

<h2>Produkt</h2>
<input id="name" placeholder="Name"><br><br>
<input id="link" placeholder="Link"><br><br>
<button onclick="saveProduct()">Speichern</button>

<h2>Barcode</h2>
<div id="barcodeBox"></div>
<button onclick="showBarcode('TEST123')">Barcode erzeugen</button>
<button onclick="printLabel()">Drucken</button>

</body>
</html>
